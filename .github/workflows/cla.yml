name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla-check:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: "signatures/cla.json"
          path-to-document: "https://github.com/lateos-ai/reflex/blob/master/CLA.md"
          branch: "cla-signatures"
          allowlist: dependabot[bot],dependabot-preview[bot]
          custom-pr-sign-comment: "I have read the CLA Document and I hereby sign the CLA"
          custom-notsigned-prcomment: |
            Thank you for your contribution! Before this PR can be merged, please
            sign our [Contributor License Agreement](https://github.com/lateos-ai/reflex/blob/master/CLA.md)
            by commenting on this PR with the exact text:

            > I have read the CLA Document and I hereby sign the CLA

            This only needs to be done once per GitHub account.
