name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  # No GitHub-hosted runner has an NVIDIA GPU, so build.rs must skip invoking
  # nvcc entirely -- this is exactly the "editing/type-checking on a machine
  # without CUDA" path CLAUDE.md documents. It does not build or run any CUDA
  # kernel; real GPU-hardware verification stays a manual step (see
  # CLAUDE.md's "There is no CPU/mock fallback" note).
  REFLEX_SKIP_CUDA: "1"

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Build (nvcc skipped, no GPU on hosted runners)
        run: cargo build --locked --all-targets

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test (GPU-hardware tests are #[ignore]d and skipped here)
        run: cargo test --locked

  # sidecar/openai-adapter is a deliberately separate Cargo project (own
  # Cargo.toml/Cargo.lock, not a workspace member, no dependency on reflex-engine --
  # see its own README) specifically so it never needs nvcc/CUDA. It builds with a
  # plain stable toolchain, so it runs on the same hosted-runner matrix as the job
  # above with no REFLEX_SKIP_CUDA or other CUDA-avoidance needed.
  sidecar-build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: sidecar/openai-adapter
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sidecar/openai-adapter

      - name: Format check
        run: cargo fmt --check

      - name: Build
        run: cargo build --locked --all-targets

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked
