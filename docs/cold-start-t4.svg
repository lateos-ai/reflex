<text x="80.0" y="1060.0" font-size="15" font-weight="400" fill="#64748b" text-anchor="start" opacity="1.0">Source: scripts/bench_cold_common.sh — external /usr/bin/time -v, process launch to exit. Same GGUF (Qwen3-0.6B-Q4_K_M), same prompt ("Once upon a time"),</text>
<text x="80.0" y="1082.0" font-size="15" font-weight="400" fill="#64748b" text-anchor="start" opacity="1.0">same Tesla T4, same session. Reflex and llama.cpp are both AOT-compiled by nvcc, so the llama.cpp rows do not exercise the AOT-vs-JIT bet; vLLM 0.30.0 has no GGUF</text>
<text x="80.0" y="1104.0" font-size="15" font-weight="400" fill="#64748b" text-anchor="start" opacity="1.0">support and ran on the HF safetensors checkpoint. Ollama / vLLM n=3; Ollama's 38.8 s cold-first-run outlier is omitted here (see bench-results/t4-refresh-2026-09-29/).</text>
