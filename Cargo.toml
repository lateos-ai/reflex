[package]
name = "reflex-engine"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "A high-performance, GGUF-native Rust & CUDA inference engine optimized for cold-start latency and real-time \"System 1\" agent decision loops."
repository = "https://github.com/lateos-ai/reflex"
readme = "README.md"
keywords = ["llm", "inference", "cuda", "gguf"]
categories = ["command-line-utilities", "science"]
build = "build.rs"

[lib]
# Phase 4 (Embeddability) round 2: cdylib/staticlib alongside the default
# rlib so `src/ffi.rs`'s extern "C" surface is actually linkable from a C
# host, while keeping rlib so `src/bin/reflex/`'s subcommand modules still
# link against this crate unmodified.
crate-type = ["rlib", "cdylib", "staticlib"]
# Explicit (rather than relying on the `[package] name`'s auto hyphen->underscore
# conversion) because `maturin build --features python` (see src/python.rs) reads
# this literally and rejects a hyphenated module name outright -- it must match the
# `#[pymodule] fn reflex_engine` symbol name in src/python.rs.
name = "reflex_engine"

[dependencies]
cudarc = { version = "0.11", features = ["driver", "cublas", "cuda-12000", "f16"] }
half = "2.3"
memmap2 = "0.9"
# Temperature/top-k/top-p sampling (`src/sampling.rs`), used by `Model::generate`
# unconditionally (greedy argmax stays the default and needs no RNG draw at all --
# see `SamplingParams::is_greedy`), so this is a core dependency, not feature-gated
# like `ipc`/`python`/`download` above.
rand = "0.8"
# Local IPC (`reflex stdio`/`reflex uds`, see src/ipc.rs), feature-gated: this
# project's default `cargo build` stays at its original 3-dependency footprint
# for users who never touch the IPC subcommands.
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
# Python bindings (see src/python.rs), feature-gated for the same reason as `ipc`
# above. abi3-py38 targets the stable/limited Python C API so one build works
# across CPython 3.8+ without a per-version build matrix.
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py38"], optional = true }
# hf-hub as a GGUF downloader/cache only (see src/hf.rs) -- never a new tensor-format
# ingestion path (no safetensors parsing). Feature-gated for the same reason as
# `ipc`/`python` above.
hf-hub = { version = "0.3", optional = true }
# NVML energy instrumentation (see src/energy.rs), feature-gated for the same
# reason as `ipc`/`python`/`download` above. Loads libnvidia-ml.so/nvml.dll at
# runtime via dlopen (never linked at build time), so this feature never breaks
# a REFLEX_SKIP_CUDA=1 dev build.
nvml-wrapper = { version = "0.13", optional = true }

[features]
# Explicit (rather than relying on Cargo's implicit "no default key = no default
# features" behavior) so the core build's footprint is a documented contract, not
# an accident. `cargo build --release` and `cargo build --release
# --no-default-features` are equivalent today: neither pulls in any optional
# dependency. See docs/reference.md's "Build features" section for the full core-vs-optional
# split and each feature's extra host build requirement.
default = []
# `ipc`'s own wire protocol (src/ipc.rs) needs serde too, so it just pulls in
# `json-output` rather than declaring `dep:serde`/`dep:serde_json` a second
# time -- cargo unifies the shared deps, no duplication/conflict from having
# both features on at once.
ipc = ["json-output"]
# Requires a Python 3.8+ interpreter on the build host (pyo3-build-config
# probes for it; abi3 avoids a per-version matrix but not Python discovery).
python = ["dep:pyo3"]
# Requires libssl-dev + pkg-config on the build HOST at Linux build time
# (hf-hub -> ureq -> openssl-sys on Linux; native-tls on Windows, no extra dep).
download = ["dep:hf-hub"]
# Pure-Rust + dlopen(libnvidia-ml) at runtime -- no extra host build dependency.
nvml = ["dep:nvml-wrapper"]
# --json output on generate/system1/bench/smoke/check/doctor (see
# src/cli_output.rs) -- deliberately its own feature rather than reusing `ipc`,
# since JSON output is orthogonal to the IPC transport.
json-output = ["dep:serde", "dep:serde_json"]

[[bin]]
name = "reflex"
path = "src/bin/reflex/main.rs"
# No required-features: the binary must always build. The `stdio`/`uds`
# subcommands are gated inside main.rs via #[cfg(feature = "ipc")] instead
# of at the Cargo-target level, since there's only one binary now.

# Measures a command's whole-process GPU energy from outside it (NVML counter,
# idle baseline subtracted) -- see src/bin/reflex-energy.rs. Needs NVML, so it only
# builds with `--features nvml`; the core `reflex` binary is unaffected.
[[bin]]
name = "reflex-energy"
path = "src/bin/reflex-energy.rs"
required-features = ["nvml"]

[dev-dependencies]
