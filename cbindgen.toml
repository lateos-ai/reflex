# cbindgen config for Phase 4 (Embeddability) round 2's C-FFI surface
# (src/ffi.rs). Regenerate include/coldstart_infer.h after editing that
# file's public surface with:
#   cbindgen --config cbindgen.toml --crate coldstart-infer --output include/coldstart_infer.h

language = "C"
header = """/* coldstart-infer C-FFI header.
 *
 * Generated by cbindgen from src/ffi.rs -- that file is the source of
 * truth; see its module doc comment and README.md's "Phase 4 --
 * Embeddability" section for scope. Do not edit this file by hand; changes
 * will be overwritten the next time it's regenerated. */"""
include_guard = "COLDSTART_INFER_H"
autogen_warning = "/* Warning: autogenerated by cbindgen from src/ffi.rs. Do not edit by hand. */"
braces = "SameLine"
line_length = 100
tab_width = 4
documentation = true
documentation_style = "doxy"
style = "type"

[export]
include = ["ColdstartModel", "ColdstartGenerateResult", "ColdstartSystem1Result", "ColdstartSystem1CandidateResult"]

[parse]
parse_deps = false
