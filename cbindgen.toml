# cbindgen config for the C-FFI surface (src/ffi.rs). Regenerate
# include/reflex_engine.h after editing that file's public surface with:
#   cbindgen --config cbindgen.toml --crate reflex-engine --output include/reflex_engine.h

language = "C"
header = """/* Reflex (reflex-engine) C-FFI header.
 *
 * Generated by cbindgen from src/ffi.rs -- that file is the source of
 * truth; see its module doc comment and README.md's "Embeddability"
 * section for scope. Do not edit this file by hand; changes will be
 * overwritten the next time it's regenerated. */"""
include_guard = "REFLEX_ENGINE_H"
autogen_warning = "/* Warning: autogenerated by cbindgen from src/ffi.rs. Do not edit by hand. */"
braces = "SameLine"
line_length = 100
tab_width = 4
documentation = true
documentation_style = "doxy"
style = "type"

[export]
include = ["ReflexModel", "ReflexGenerateResult", "ReflexSystem1Result", "ReflexSystem1CandidateResult"]

[parse]
parse_deps = false
